packages:
  - 'packages/*'
allowBuilds:
  esbuild: true
  workerd: true
# @cloudflare/workers-types publishes a new calendar-versioned release
# roughly every 24h, so resolving to "latest" almost always lands inside a
# minimumReleaseAge supply-chain policy window. Pinned to a safely-aged
# version — applies repo-wide since it's only a transitive dependency of
# wrangler / @cloudflare/vitest-pool-workers, nothing here depends on it
# directly for anything version-sensitive.
overrides:
  '@cloudflare/workers-types': 5.20260817.1
