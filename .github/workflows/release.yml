name: Release

on:
  push:
    branches: [main]

# A second push while a release is in flight would race the version PR against
# the publish that consumes it.
concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: the OIDC token stands in for a stored NPM_TOKEN.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm 10 deliberately: 11 regressed OIDC publishing into a 404
      # (pnpm/pnpm#11513). Confirm that is fixed before moving to 11.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # No `registry-url`, deliberately. It makes setup-node write an .npmrc
      # holding `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and
      # under trusted publishing that variable does not exist — pnpm then
      # reports `Failed to replace env in config` and publishes with broken
      # credentials, which npm answers with a 404 rather than a 401. Omitting
      # it leaves no .npmrc at all, so pnpm runs the OIDC exchange itself and
      # falls back to the default registry, which is the one we want.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Opens (or refreshes) the version PR while changesets are pending, and
      # publishes once that PR merges and none are left.
      - uses: changesets/action@v1
        with:
          version: pnpm run version:packages
          publish: pnpm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
