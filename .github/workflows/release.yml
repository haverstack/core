name: Release

on:
  push:
    branches: [main]

# A second push while a release is in flight would race the version PR against
# the publish that consumes it.
concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: the OIDC token stands in for a stored NPM_TOKEN.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm 11, ahead of the 10 the CI workflow pins: `changeset publish`
      # shells out to `pnpm publish`, and the OIDC exchange that stands in for
      # a stored token is an 11.x feature.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      # No `registry-url`: it writes an .npmrc referencing ${NODE_AUTH_TOKEN},
      # a variable trusted publishing never sets. pnpm runs the OIDC exchange
      # itself and reaches the default registry without it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Opens (or refreshes) the version PR while changesets are pending, and
      # publishes once that PR merges and none are left.
      - uses: changesets/action@v1
        with:
          version: pnpm run version:packages
          publish: pnpm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
